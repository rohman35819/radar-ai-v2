name: RADAR AI tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'exp/**', 'hotfix/**']

jobs:
  branch-policy:
    name: Branch source policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed PR source branches
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          case "$BASE_BRANCH" in
            main)
              case "$HEAD_BRANCH" in
                develop|hotfix/*) echo "Allowed production PR source: $HEAD_BRANCH" ;;
                *) echo "PRs to main must come from develop or hotfix/*; got $HEAD_BRANCH"; exit 1 ;;
              esac
              ;;
            develop)
              case "$HEAD_BRANCH" in
                feat/*|fix/*|exp/*|docs/*|chore/*|ci/*|security/*|test/*|refactor/*) echo "Allowed integration PR source: $HEAD_BRANCH" ;;
                *) echo "PRs to develop must come from feat/*, fix/*, exp/*, docs/*, chore/*, ci/*, security/*, test/*, or refactor/*; got $HEAD_BRANCH"; exit 1 ;;
              esac
              ;;
            *) echo "No branch source policy defined for target $BASE_BRANCH"; exit 1 ;;
          esac

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar_test -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Set up Python for offline research tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Strict TypeScript type check
        run: npm run typecheck
      - name: Python offline research unit tests
        run: npm run test:python
      - name: Prepare disposable PostgreSQL roles
        run: docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply Agent Platform schema migration
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/migrations/001_agent_platform.sql
      - name: Verify Agent Platform schema and least-privilege observer
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/tests/001_agent_platform_smoke.sql
      - name: Apply transactional queue operations migration
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/migrations/002_queue_operations.sql
      - name: Verify queue, lease, retry, approval and kill-switch semantics
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/tests/002_queue_operations_smoke.sql
      - name: Apply provenance-first memory migration
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < supabase/migrations/20261124_radar_memory.sql
      - name: Verify memory RLS, privileges, provenance and proposal-only lifecycle
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < supabase/tests/20261124_radar_memory_smoke.sql
      - name: Apply market-data storage schema (disposable PostgreSQL only)
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/migrations/003_market_data.sql
      - name: Verify market-data provenance, idempotency, RLS and OHLCV partitions
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/tests/003_market_data_smoke.sql
      - name: Hostless LIVE readiness and News probe (diagnostic only)
        if: github.head_ref == 'ops/hostless-live-check'
        run: npm run hostless-check
        continue-on-error: true
      - name: Diagnostic live RSS smoke (non-blocking, News fix branch only)
        if: github.head_ref == 'fix/news-feed-resilience-v2'
        run: npm run news-check
        continue-on-error: true
