name: RADAR AI tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'feat/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar_test -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Apply Agent Platform migration to disposable PostgreSQL
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/migrations/001_agent_platform.sql
      - name: Verify Agent Platform schema and runtime audit permissions
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U radar_test -d radar_test < db/tests/001_agent_platform_smoke.sql
