name: RADAR AI tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Diagnostic live RSS smoke (non-blocking, News fix branch only)
        if: github.head_ref == 'fix/news-feed-resilience'
        run: npm run news-check
        continue-on-error: true
