name: Hostless deployment monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostless-deployment-monitor
  cancel-in-progress: true

jobs:
  deployment:
    name: Verify Hostless deployment and LIVE
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HOSTLESS_API_KEY: ${{ secrets.HOSTLESS_API_KEY }}
      HOSTLESS_APP_NAME: ${{ vars.HOSTLESS_APP_NAME || 'radar-ai-v2' }}
      RADAR_LIVE_URL: ${{ vars.RADAR_LIVE_URL || 'https://radar-ai-v2.hostless.app' }}
    steps:
      - name: Validate monitor configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$HOSTLESS_API_KEY" ]]; then
            echo "::warning::Missing HOSTLESS_API_KEY; Hostless deployment metadata check will be skipped. Add a read-only deployments:read token to GitHub Actions secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! "$HOSTLESS_APP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$ ]]; then
            echo "::error::HOSTLESS_APP_NAME is invalid."
            exit 1
          fi
          echo "Monitoring Hostless app: $HOSTLESS_APP_NAME"
          echo "LIVE URL: $RADAR_LIVE_URL"

      - name: Read latest Hostless deployment
        if: steps.config.outputs.enabled == 'true'
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 25 \
            -H "Authorization: $HOSTLESS_API_KEY" \
            -H "Accept: application/json" \
            "https://api.hostless.cloud/v1/apps/$HOSTLESS_APP_NAME/deployments" \
            -o "$RUNNER_TEMP/hostless-deployments.json"

          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/hostless-deployments.json', 'utf8'));
          const candidates = [
            body,
            body && body.deployments,
            body && body.data,
            body && body.items,
            body && body.results,
            body && body.data && body.data.deployments
          ];
          let rows = candidates.find(Array.isArray);
          if (!rows && body && body.deployment && typeof body.deployment === 'object') rows = [body.deployment];
          if (!rows || !rows.length) {
            console.error('Hostless API returned no deployment records. Check app name and deployments:read permission.');
            process.exit(1);
          }
          const timeOf = (item) => Date.parse(item.createdAt || item.created_at || item.startedAt || item.started_at || item.queuedAt || '') || 0;
          rows = [...rows].sort((a, b) => timeOf(b) - timeOf(a));
          const latest = rows[0];
          const get = (...keys) => {
            for (const key of keys) if (latest[key] !== undefined && latest[key] !== null) return latest[key];
            return '';
          };
          const id = String(get('id', 'deploymentId', 'deployment_id'));
          const status = String(get('status', 'state', 'outcome') || 'UNKNOWN').toUpperCase();
          const commit = String(get('gitCommitHash', 'git_commit_hash', 'commitHash', 'commit', 'sha'));
          const created = String(get('createdAt', 'created_at', 'startedAt', 'started_at'));
          const expected = process.env.GITHUB_SHA || '';
          const sameCommit = Boolean(commit && expected && (commit.startsWith(expected) || expected.startsWith(commit)));
          const pending = /QUEUED|PENDING|BUILDING|RUNNING|IN_PROGRESS|RELEASING|STARTING/.test(status);
          const failed = /FAILED|ERROR|CANCELLED|CANCELED|CRASHED/.test(status);
          const succeeded = /SUCCESS|SUCCEEDED|DEPLOYED|READY|COMPLETED/.test(status);
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + String(value).replace(/[\r\n]/g, '') + '\n');
          output('status', status);
          output('commit', commit || 'not-reported');
          output('id', id || 'not-reported');
          output('same_commit', sameCommit);
          output('pending', pending);
          output('failed', failed);
          output('succeeded', succeeded);
          const lines = [
            '### Hostless deployment',
            '',
            '| Field | Result |',
            '|---|---|',
            '| App | ' + process.env.HOSTLESS_APP_NAME + ' |',
            '| Latest deployment | ' + (id || 'not reported') + ' |',
            '| Deployment status | **' + status + '** |',
            '| Deployed commit | `' + (commit || 'not reported') + '` |',
            '| GitHub main commit | `' + expected + '` |',
            '| Commit matches main | ' + (sameCommit ? 'yes' : commit ? 'no' : 'not reported') + ' |',
            '| Created | ' + (created || 'not reported') + ' |',
            '',
            pending ? 'Deployment is still in progress; the current LIVE release is checked separately.' :
              failed ? ':: Deployment failed. Inspect the Hostless deployment logs.' :
              succeeded && sameCommit ? 'Deployment reports success for the current GitHub commit.' :
              succeeded ? 'A successful deployment is reported, but it does not match the current GitHub main commit.' :
              'Hostless returned an unrecognized deployment state; do not treat this as verified success.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          if (failed) process.exit(1);
          if (succeeded && commit && !sameCommit) process.exit(1);
          NODE

      - name: Check out repository for LIVE snapshot probe
        if: always()
        uses: actions/checkout@v7

      - name: Verify public LIVE readiness
        if: always()
        id: live
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --max-time 20 \
            -H "Accept: application/json" \
            -o "$RUNNER_TEMP/radar-ready.json" \
            -w "%{http_code}" "$RADAR_LIVE_URL/api/ready")
          echo "http=$code" >> "$GITHUB_OUTPUT"
          HTTP_CODE="$code" node -e "
            const fs = require('node:fs');
            let data = null;
            try { data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/radar-ready.json', 'utf8')); } catch {}
            const safe = { http: process.env.HTTP_CODE || '', status: data && data.status || null, storage: data && data.storage ? { status: data.storage.status || null, code: data.storage.code || null } : null };
            console.log(JSON.stringify(safe));
            const lines = ['### LIVE readiness', '', '| Field | Result |', '|---|---|', '| HTTP | ' + safe.http + ' |', '| API status | ' + (safe.status || 'unavailable') + ' |', '| Storage | ' + (safe.storage && safe.storage.status || 'unknown') + ' |', '| Storage code | ' + (safe.storage && safe.storage.code || 'none') + ' |'];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n');
            if (Number(safe.http) !== 200 || safe.status !== 'ready') process.exit(1);
          "

      - name: Verify LIVE snapshot and news sources
        if: always() && steps.live.outputs.http == '200'
        env:
          RADAR_LIVE_URL: ${{ env.RADAR_LIVE_URL }}
        run: node scripts/hostless-live-check.js
