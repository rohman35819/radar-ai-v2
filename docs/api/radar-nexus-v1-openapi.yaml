openapi: 3.1.0
info:
  title: RADAR AI V2 ↔ RADAR NEXUS Read-only Interoperability Contract
  version: 0.1.0
  description: |
    Draft contract only. No API server or credentials are configured by this document.
    Initial scope is read-only market context retrieval and bounded analysis submission.
    Never send exchange secrets, service-role keys, private account data, or trading commands.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; replace after a real server is implemented and verified.
security:
  - serviceBearer: []
paths:
  /v1/market/context:
    get:
      operationId: getMarketContext
      summary: Retrieve an allowlisted RADAR market snapshot
      parameters:
        - in: query
          name: asset
          required: true
          schema: { type: string, minLength: 2, maxLength: 32, pattern: '^[A-Za-z0-9._-]+$' }
        - in: query
          name: timeframe
          required: true
          schema: { type: string, enum: [1m, 5m, 15m, 1h, 4h, 1d] }
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: maxAgeSeconds
          required: true
          schema: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        '200':
          description: Validated market context; source and freshness are mandatory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketContextResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/analysis/requests:
    post:
      operationId: submitAnalysisRequest
      summary: Submit a bounded analysis request to NEXUS
      description: |
        Accepts a request for analysis only. It does not authorize order placement,
        exchange private reads, portfolio mutation, deployment, or arbitrary tool use.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRequest' }
      responses:
        '202':
          description: Request accepted for asynchronous processing; acceptance is not completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency key reused with a different request body.
        '413':
          description: Request exceeds the payload limit.
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/analysis/requests/{requestId}:
    get:
      operationId: getAnalysisRequest
      summary: Read status and bounded result of a prior analysis request
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current request state and optional result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Request not found or not visible to caller. }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    Provenance:
      type: object
      additionalProperties: false
      required: [source, observedAt, receivedAt, sourceRevision]
      properties:
        source: { type: string, minLength: 1, maxLength: 128 }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        sourceRevision: { type: string, minLength: 1, maxLength: 128 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    MarketContextResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, asset, timeframe, asOf, expiresAt, provenance, data]
      properties:
        schemaVersion: { const: '1.0' }
        asset: { type: string }
        timeframe: { type: string }
        asOf: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        provenance: { $ref: '#/components/schemas/Provenance' }
        data:
          type: object
          additionalProperties: false
          properties:
            lastPrice: { type: number, exclusiveMinimum: 0 }
            changePct: { type: number }
            volume24h: { type: number, minimum: 0 }
            candles:
              type: array
              maxItems: 500
              items:
                type: object
                additionalProperties: false
                required: [time, open, high, low, close, volume]
                properties:
                  time: { type: string, format: date-time }
                  open: { type: number, exclusiveMinimum: 0 }
                  high: { type: number, exclusiveMinimum: 0 }
                  low: { type: number, exclusiveMinimum: 0 }
                  close: { type: number, exclusiveMinimum: 0 }
                  volume: { type: number, minimum: 0 }
    AnalysisRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, taskType, asset, timeframe, context, acceptanceCriteria, expiresAt]
      properties:
        schemaVersion: { const: '1.0' }
        taskType: { type: string, enum: [market_summary, risk_review, strategy_hypothesis_review] }
        asset: { type: string, minLength: 2, maxLength: 32 }
        timeframe: { type: string, enum: [1m, 5m, 15m, 1h, 4h, 1d] }
        context:
          type: object
          additionalProperties: false
          required: [snapshotRef, provenance]
          properties:
            snapshotRef: { type: string, minLength: 1, maxLength: 512 }
            provenance: { $ref: '#/components/schemas/Provenance' }
        acceptanceCriteria:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 500 }
        expiresAt: { type: string, format: date-time }
    AnalysisAccepted:
      type: object
      additionalProperties: false
      required: [schemaVersion, requestId, status, acceptedAt, correlationId]
      properties:
        schemaVersion: { const: '1.0' }
        requestId: { type: string, format: uuid }
        status: { const: queued }
        acceptedAt: { type: string, format: date-time }
        correlationId: { type: string }
    AnalysisStatus:
      type: object
      additionalProperties: false
      required: [schemaVersion, requestId, status, createdAt, updatedAt]
      properties:
        schemaVersion: { const: '1.0' }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [queued, claimed, running, succeeded, failed, cancelled, dead_letter] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resultRef: { type: string, maxLength: 512 }
        errorCode: { type: string, maxLength: 64 }
  responses:
    BadRequest:
      description: Malformed, stale, expired, unsupported, or secret-bearing request.
    Unauthorized:
      description: Missing or invalid service identity.
    Forbidden:
      description: Identity is valid but lacks the requested scope.
    RateLimited:
      description: Caller exceeded its configured rate limit.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
    Unavailable:
      description: Dependency unavailable; caller must not silently fall back to local persistent storage.
